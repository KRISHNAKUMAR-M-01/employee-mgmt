<div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{title}}</h5>

                <button type="button" class="btn-close" [attr.aria-label]="cancelText"
                    (click)="cancelled.emit()"></button>
            </div>

            <div class="modal-body">
                <p class="mb-0">{{message}}</p>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" (click)="cancelled.emit() ">{{cancelText}}</button>
                <button class="btn btn-danger" type="button" (click)="confirmed.emit()">{{confirmText}}</button>
            </div>
        </div>
    </div>
</div>
<div class="modal-backdrop fade show"></div>
